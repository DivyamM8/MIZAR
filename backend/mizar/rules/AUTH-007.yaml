id: AUTH-007
version: 2.0.0
status: stable
title: Logons for {username} from {first_seen_count} source(s) first seen after the baseline
description: >
  Successful logons for {username} came from {first_seen_count} source address(es) with no
  logon from them in the first {params.baseline} of this case's logon data. The new
  addresses are listed under the observed evidence.
attack: [T1078]
type: first_seen
filter:
  all:
    - {field: event_type, op: eq, value: logon}
    - {field: event_outcome, op: eq, value: success}
    - {field: source_ip, op: exists}
group_by: [username]
first_seen: {key: [username, source_ip], baseline: baseline}
params:
  baseline: {type: duration, default: 24h, description: Initial period of the data treated as normal}
severity:
  base: low
  reason: A new source for an account is unusual but common for travel, new devices or new networks.
confidence:
  base: low
  reason: Rarity is judged only within this case's data, not the account's full history.
evidence_strength: inferred
interpretation: >
  Within the data in this case, {username} logged on from {first_seen_count} address(es)
  not used in the baseline, the first at {first}. The case data may not cover the account's
  full history.
alternative_explanations:
  - The user started working from a new location, VPN or device.
  - The case data starts too late to include earlier logons from this address.
verification_steps:
  - Ask the account owner whether the logons from the new addresses were theirs.
  - Check what the sessions did after those logons.
