[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mizar"
version = "0.1.0"
description = "Local log analysis and investigation tool for security investigators"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "evtx>=0.8",
    "reportlab>=4.2",
    "google-re2>=1.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
mizar = "mizar.__main__:main"

[tool.setuptools.packages.find]
include = ["mizar*"]

[tool.setuptools.package-data]
mizar = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["mizar/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mizar"]
exclude = ["mizar/db/migrations/"]

[[tool.mypy.overrides]]
module = ["evtx.*", "re2.*", "reportlab.*"]
ignore_missing_imports = true
